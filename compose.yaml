services:
  marketplace-alerts:
    build: .
    image: marketplace-alerts:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: ${DOCKER_APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${DOCKER_COOKIE_SECURE:-false}
      TRUST_PROXY: ${DOCKER_TRUST_PROXY:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - scout-data:/app/data
    stop_grace_period: 150s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scout-data:
